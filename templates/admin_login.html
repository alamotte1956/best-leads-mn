<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Restoration Contractors MN</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
            color: #0f172a;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            margin: 20px;
            padding: 36px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }
        h1 { margin-top: 0; font-size: 25px; }
        p { color: #64748b; line-height: 1.5; }
        label { display: block; margin: 20px 0 8px; font-weight: bold; }
        input[type="password"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #334155; }
        .error {
            padding: 12px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 7px;
            margin-top: 16px;
        }
        .back { display: block; margin-top: 22px; text-align: center; }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Administrator Login</h1>
        <p>Restoration Contractors MN<br>Secure Administration</p>

        {% if error %}
        <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <input type="hidden"
                   name="_csrf"
                   value="{{ csrf_token() }}">

            <label for="password">Administrator Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   autocomplete="current-password"
                   required>

            <button type="submit">Sign In</button>
        </form>

        <a class="back" href="/">Return to Website</a>
    </main>
</body>
</html>
