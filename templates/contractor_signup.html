<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contractor Signup - Restoration Contractors MN</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="max-w-xl mx-auto px-4 py-12">
        <div class="bg-white shadow-md rounded-lg p-8">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800">Contractor Network Signup</h1>
                <a href="/" class="text-blue-600 hover:underline text-sm"> Back to Home</a>
            </div>
            <form method="POST" action="/contractors/signup" class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-medium mb-1">Company Name</label>
                    <input type="text" name="company_name" required class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-1">Contact Name</label>
                    <input type="text" name="contact_name" required class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-1">Email Address</label>
                    <input type="email" name="email" required class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-1">Phone Number</label>
                    <input type="text" name="phone" required class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-1">MN DLI License Number</label>
                    <input type="text" name="license_number" required placeholder="e.g., BC123456" class="w-full px-3 py-2 border rounded-lg">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700">Register & Join Network</button>
            </form>
        </div>
    </div>
</body>
</html>
